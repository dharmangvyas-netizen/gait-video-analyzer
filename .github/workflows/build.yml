name: Build installers
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Put files into folders
        shell: bash
        run: |
          echo "== Files in repo =="; ls -la
          mkdir -p app build scripts license-server
          pick() { f=$(find . -path ./node_modules -prune -o -path ./.git -prune -o -type f -iname "$1" -print | grep -v "^./$2" | head -1 || true); [ -n "$f" ] && [ ! -f "$2" ] && cp "$f" "$2"; true; }
          pick index.html app/index.html
          pick check-config.js scripts/check-config.js
          pick worker.js license-server/worker.js
          pick icon.ico build/icon.ico
          pick icon.icns build/icon.icns
          pick icon.png build/icon.png
          pick icon.png app/icon.png
          [ -f app/index.html ] || { echo "ERROR: index.html is not in the repo - please upload it"; exit 1; }
          [ -f scripts/check-config.js ] || echo "console.log('config check skipped')" > scripts/check-config.js
          if [ ! -f build/icon.ico ]; then echo "No icon.ico - building with default icon"; node -e "const p=require('./package.json');delete p.build.win.icon;if(p.build.mac)delete p.build.mac.icon;require('fs').writeFileSync('package.json',JSON.stringify(p,null,2))"; fi
          echo "== Arranged =="; ls -R app build scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: GaitVideoAnalyzer-Windows-Setup
          path: dist/*.exe
